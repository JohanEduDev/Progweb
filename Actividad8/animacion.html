<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <!--meta adaptar el sitio a pantallas de diferente dispositivo-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0 maximun-scale=1.0, minimun-scale=1.0, user-scalable=no"/>
        <title>Animacion de Texto e Imagenes</title>
        <!--se vincula a la hoja de estilo Animate.css que se encuentra en el sitio del autor-->
        <!--link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/-->
        <!--se vincula a la hoja de estilo local-->
        <link rel="stylesheet" type="text/css" href="/css/animate.css">
    </head>
    <body>
        <div>
            <h1 class="animate__animated animate__bounceIn animate__infinite infinite">Animacion CSS</h1>
        </div>_________________________________________________________________________________________________
        <div class="animate__animated animate__fadeInTopRight animate__infinite infinite">
            <a href="http://www.google.com">GOOGLE</a>
        </div>
        <div class="animate__animated animate__zoomInUp animate__repeat-2">
            <img src="/img/imagen1.png" width="600" height="350"/>
        </div>
    </body>
</html>
